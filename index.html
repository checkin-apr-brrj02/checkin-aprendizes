<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Check-in de Presença</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f4f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .logo-text { font-size: 14px; font-weight: 600; color: #1a1a1a; line-height: 1.2; }
    .logo-sub { font-size: 11px; color: #888; font-weight: 400; }
    h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0;
      border-radius: 10px; font-size: 15px; color: #1a1a1a; margin-bottom: 16px;
      outline: none; transition: border-color 0.15s; -webkit-appearance: none;
    }
    input:focus { border-color: #3730b8; }
    input.otp-input { letter-spacing: 10px; font-size: 22px; font-weight: 600; text-align: center; }
    button {
      width: 100%; padding: 14px; background: #3730b8; color: #fff; border: none;
      border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:hover:not(:disabled) { background: #2c279a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; display: none; }
    .msg.erro    { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .msg.sucesso { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .msg.aviso   { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .step { display: none; }
    .step.ativo { display: block; }
    .geo-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #888; margin-bottom: 20px; }
    .geo-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; }
    .geo-dot.ok      { background: #22c55e; }
    .geo-dot.erro    { background: #ef4444; }
    .geo-dot.loading { background: #f59e0b; }
    .reenviar { text-align: center; margin-top: 12px; }
    .reenviar button { background: none; color: #3730b8; font-size: 13px; font-weight: 500; padding: 0; width: auto; text-decoration: underline; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="jsonp-container" style="display:none"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAMAAACahl6sAAAAUVBMVEX///+Fgki/siOTmcHFyN59hLTz8/coNIP34AA0P4RfYWFJT25QWZdgaJ1CTI+us9DX2ejWxRXk5u/r1ghrc6mpnzGhpsm0s5ibkzrn5L6dlTnoCCChAAAACXBIWXMAAAsTAAALEwEAmpwYAAAJ0ElEQVR4nO1ciZKkKBBVQSgs8S67av//Qzc4VPAi8ajuieBF7MTOTI/6yDtJiKKAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgEuBLUT/GAguUcp5QVdQcI4QxiT62yAYpZyCwNP+j9LBqFuTAcs02Jp8ur6K/hIwsuTAsiyOkyR5zNEmSRLHNin2V8g0ZTd91TOLV75/iTZ5xQYdlv62I2j6fBJDnLQADhadOBvJdOWvmQwpBxYs+69+HMRE5pfkgtNBnWKIMjkk89TWj5rvsiCl9lDP46KwUQ9c0i+KpUHKTp/xRSwUkliHmPJLNLROndaoJdqXEkvxBSpE0XjGnh7KUyzFzVSIUqrn63EfakWF32kr5f00BFpFpbvLg1X8KzQmqTB0Cw8kn/0NGgK1DJP59WlYJaP4XSa+hkR6MHSHOJ6Xhg2gqfArLYVI64gPfIvM2sXSPrMsfvsuRC3+JbvOfVXskDjGrMNA5pkMxFeql3S68cEgvYRfYpOIl3fkKvNgWfbysvN4rJpyniKBlE+F1BP8sDZ+igXJL2AiUhL5MAZPrpTDoTTvLf1ucDpWMCD/V8v1EI64qK7gkQ0VOYMVgfFObTHVlK51aV+64mI/4pfqPI8fkfGOHZLsVQNcDWWlswrYs5Z6YEELRKLPaSaahwBORx3fqAlFCT5YuMM8h7qMsni5LvVYMI61yac4x8TgMeNCsxkZ4+Ug14+N3ovuHuleER1RpKNyCibFYYvvbR5zLvQZv/X7jbcLGwcFYzJ1YNZQ2DXv54TvwkseAtXoepaQLFPw+5rSXBfjMXzZtBNM0kM8GkYpX/8rgifjn+SAcCl5eL4Go24KMYx3CK8L9HM0xueUFjt/TTCaGu48FR3pVR6klKSLzlW8Epcgfyil+Jihf5w/RcS+h1aDaoUHMXTndB3Ojxj8hoG4UssZj942gZMp+ac4YCbFpoHAeTQ6Iyh4qrccdsIkBB9/5RKZopcUieBhU8dKHKnSvEr1keAubUu5It/P8lIski/8fDpvhTQ5PMhsgFBK+8gDKaX5OR6qqCzwSv/iTMX3QynzkGkD8lgG+JxHVazqkTQkesZQCq9ggjwFImuvapbcrFq2FN3BCD2KJPKxEF+BmDxIt9OTkqbDj5t84SHR0tc32JFKNVY3E/n+XOftx0NbuG8slKqlstVK78ft+Bbplg9XF4RSWsFN3U/0SvPNBHL3VcoTHDV5Drax0jeoj7smQwqLCIT4wXbVB6z4na9mCUxVvVHXOYgfi/KEUgoLqr4+awTG5ZgKuyCZHCv5OFAtRTYe3Q9ZvBxqV/0AjeSAiRzCYef1ATpgROnPV6YpDjqvRlSKkB/kokmZy9r1Zvg7r6rXhQ0k8cxVt5V+g4xyXrCfrfpO15sMRkQ0rKbIdvNEBYJlXsTqGz1hYqSUvq3RsK5vbnZe+8VWhczEgWWiHYhg8SYRXWSzB1roevX7zgubHTSWyd07GBHRPtFtXYvMbVyk81ovG7GhUJqEQEZp50VEknlPfd38niE35bwWbrgyWNj9/wwU6WZE7E47A+RRB5h0C+fVTBrFFrt+cCLxzg7tLcMudg5JynFodXW/73mCiDEXNlAhGKHLJl1V2UjE/zajSm3taFEwkcyx5ZyScfxMN3waaNY7fvlsYkbWx0UV4Wm/cmtfroUREckv23jE45Eo02dGUzcdnEvuqqdMpPNyRHaKWAHYKU1gRERApLVrbEd5M     <div>
      <div class="logo-text">Mercado Livre</div>
      <div class="logo-sub">BRRJ02 — Check-in de presença</div>
    </div>
  </div>

  <div id="step1" class="step ativo">
    <h1>Registrar presença</h1>
    <p class="subtitle">Digite seu e-mail cadastrado para receber o código de confirmação.</p>
    <div id="geo-status" class="geo-status">
      <div class="geo-dot loading" id="geo-dot"></div>
      <span id="geo-text">Obtendo sua localização...</span>
    </div>
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email"/>
    <button id="btn-enviar" onclick="enviarOtp()">Enviar código</button>
    <div id="msg1" class="msg"></div>
  </div>

  <div id="step2" class="step">
    <h1>Código de verificação</h1>
    <p class="subtitle" id="msg-email-enviado">Digite o código de 6 dígitos enviado para o seu e-mail.</p>
    <label for="otp">Código</label>
    <input type="number" id="otp" class="otp-input" placeholder="000000" maxlength="6" oninput="this.value=this.value.slice(0,6)"/>
    <button id="btn-confirmar" onclick="confirmarOtp()">Confirmar presença</button>
    <div id="msg2" class="msg"></div>
    <div class="reenviar">
      <button onclick="voltarStep1()">Usar outro e-mail</button>
    </div>
  </div>

  <div id="step3" class="step">
    <div id="resultado"></div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbw7HWwez-NXKRDBh3GcGEJlrrjGnbKMEYCk-BhM4PRHnoLzhpKcQbcJklVmI0tp67SL/exec';

  let token = '';
  let latCapturada = null;
  let lngCapturada = null;
  let emailUsado   = '';
  let ipCapturado  = 'N/A';

  function chamarAPI(params, callback) {
    const cbName = 'cb_' + Date.now();
    const qs = Object.keys(params)
      .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
      .join('&');
    const url = API_URL + '?' + qs + '&callback=' + cbName;

    window[cbName] = function(data) {
      delete window[cbName];
      const s = document.querySelector('script[data-cb="' + cbName + '"]');
      if (s) s.parentNode.removeChild(s);
      callback(data);
    };

    const script = document.createElement('script');
    script.src = url;
    script.dataset.cb = cbName;
    script.onerror = function() {
      delete window[cbName];
      callback({ ok: false, msg: 'Erro de conexão. Tente novamente.' });
    };
    document.getElementById('jsonp-container').appendChild(script);
  }

  // Captura IP via múltiplas APIs como fallback
  function capturarIP() {
    const apis = [
      'https://api.ipify.org?format=json',
      'https://api4.my-ip.io/ip.json',
      'https://api.myip.com'
    ];

    const tentar = (index) => {
      if (index >= apis.length) return;
      fetch(apis[index])
        .then(r => r.json())
        .then(d => {
          ipCapturado = d.ip || d.IP || 'N/A';
        })
        .catch(() => tentar(index + 1));
    };

    tentar(0);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    token = params.get('token') || '';

    if (!token) {
      bloquear('Link inválido. Aguarde o próximo link no grupo.');
      return;
    }

    chamarAPI({ acao: 'validar_link', token }, function(d) {
      if (!d.ok) bloquear(d.msg);
    });

    capturarIP();

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          latCapturada = pos.coords.latitude;
          lngCapturada = pos.coords.longitude;
          document.getElementById('geo-dot').className   = 'geo-dot ok';
          document.getElementById('geo-text').textContent = 'Localização obtida';
        },
        () => {
          document.getElementById('geo-dot').className   = 'geo-dot erro';
          document.getElementById('geo-text').textContent = 'Localização não autorizada — será registrado';
        },
        { timeout: 10000, enableHighAccuracy: true }
      );
    }
  });

  function enviarOtp() {
    const email = document.getElementById('email').value.trim();
    if (!email) { mostrarMsg('msg1', 'Digite seu e-mail.', 'erro'); return; }
    setLoading('btn-enviar', true);

    // Captura IP enquanto aguarda o código chegar no email
    fetch('https://api.ipify.org?format=json')
      .then(r => r.json())
      .then(d => { ipCapturado = d.ip || 'N/A'; })
      .catch(() => {
        fetch('https://api4.my-ip.io/ip.json')
          .then(r => r.json())
          .then(d => { ipCapturado = d.ip || d.IP || 'N/A'; })
          .catch(() => { ipCapturado = 'N/A'; });
      });

    chamarAPI({ acao: 'enviar_otp', email, token }, function(d) {
      setLoading('btn-enviar', false);
      if (d.ok) {
        emailUsado = email;
        document.getElementById('msg-email-enviado').textContent =
          'Código enviado para ' + email + '. Verifique sua caixa de entrada.';
        irStep(2);
      } else {
        mostrarMsg('msg1', d.msg, 'erro');
      }
    });
  }

  function confirmarOtp() {
    const otp = document.getElementById('otp').value.trim();
    if (otp.length !== 6) { mostrarMsg('msg2', 'Digite os 6 dígitos do código.', 'erro'); return; }
    setLoading('btn-confirmar', true);

    // Garante que o IP foi capturado antes de enviar
    const enviar = () => {
      chamarAPI({
        acao:  'confirmar_otp',
        email: emailUsado,
        otp,
        lat:   latCapturada || '',
        lng:   lngCapturada || '',
        token,
        ip:    ipCapturado,
      }, function(d) {
        setLoading('btn-confirmar', false);
        if (d.ok) {
          irStep(3);
          document.getElementById('resultado').innerHTML = d.suspeito
            ? '<div class="msg aviso" style="display:block;margin:0;">' + d.msg + '</div>'
            : '<div class="msg sucesso" style="display:block;margin:0;">' + d.msg + '</div>';
        } else {
          mostrarMsg('msg2', d.msg, 'erro');
        }
      });
    };

    // Se IP ainda não foi capturado, tenta uma vez mais antes de enviar
    if (ipCapturado === 'N/A') {
      const apis = [
        'https://api.ipify.org?format=json',
        'https://api4.my-ip.io/ip.json',
        'https://api.myip.com'
      ];
      const tentarIP = (index) => {
        if (index >= apis.length) { enviar(); return; }
        fetch(apis[index])
          .then(r => r.json())
          .then(d => { ipCapturado = d.ip || d.IP || 'N/A'; enviar(); })
          .catch(() => tentarIP(index + 1));
      };
      tentarIP(0);
    } else {
      enviar();
    }
  }

  function voltarStep1() { irStep(1); }

  function irStep(n) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('ativo'));
    document.getElementById('step' + n).classList.add('ativo');
  }

  function bloquear(msg) {
    document.getElementById('step1').innerHTML =
      '<div class="msg erro" style="display:block;">' + msg + '</div>';
  }

  function mostrarMsg(id, txt, tipo) {
    const el = document.getElementById(id);
    el.textContent  = txt;
    el.className    = 'msg ' + tipo;
    el.style.display = 'block';
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled  = loading;
    btn.innerHTML = loading
      ? '<span class="spinner"></span>Aguarde...'
      : btnId === 'btn-enviar' ? 'Enviar código' : 'Confirmar presença';
  }
</script>
</body>
</html>
